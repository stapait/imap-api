recipient_delimiter = +
lmtp_save_to_detail_mailbox = yes

# LMTP resolves the user from the full RCPT TO address (e.g.
# testuser@example.com), while IMAP login uses the bare username
# (testuser). Without stripping the domain here, LMTP and IMAP would
# land in two completely separate mail stores for the "same" user.
auth_username_format = %n

service lmtp {
  inet_listener lmtp {
    port = 31025
  }
}
